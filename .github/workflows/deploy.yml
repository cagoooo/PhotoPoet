name: Deploy to Firebase

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
      - '.env.example'
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy hosting + functions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: npm ci --prefix functions || npm install --prefix functions

      - name: Build Next.js (static export)
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Inject SW CACHE_VERSION (commit SHA + date)
        run: npm run inject:sw-version

      - name: Build Cloud Functions
        run: npm run build --prefix functions

      - name: List functions to deploy (named deploy only)
        id: fns
        working-directory: functions
        run: |
          FNS=$(node -e 'const m=require("./"+(require("./package.json").main||"index.js"));const k=Object.keys(m);if(!k.length)process.exit(1);console.log(k.map(f=>"functions:"+f).join(","));process.exit(0)')
          echo "list=$FNS" >> "$GITHUB_OUTPUT"
          echo "將點名部署：$FNS"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      # 函式一律點名部署（名單由上一步從建置後的程式產生），不加 --force：
      # 萬一這個專案以後放進別的系統的函式，也不會被比對成「多餘」而刪掉
      - name: Deploy hosting + functions + firestore
        run: |
          firebase deploy \
            --only "hosting,${{ steps.fns.outputs.list }},firestore" \
            --project=photopoet-ha364 \
            --non-interactive

      - name: Print live URL
        run: echo "🌐 Live → https://photopoet-ha364.web.app"
